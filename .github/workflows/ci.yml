name: CI

# Job ids become required-check names in the `main` ruleset.

on:
  pull_request:
    # ready_for_review: the browser tests skip drafts, so marking ready must run them.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
      - run: poetry run pytest -v

  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
      - run: poetry run ruff check . ../scripts/rules
      - run: poetry run ruff format --check . ../scripts/rules
      - run: poetry run pyright

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/rules/run.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  storage-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not a service container: those take no command, and Azurite needs
      # --skipApiVersionCheck for the newer SDK. Started first, ready by pytest.
      - name: Start Azurite
        run: |
          docker run -d --rm -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --blobHost 0.0.0.0 --inMemoryPersistence --skipApiVersionCheck
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
      - run: timeout 30 sh -c 'until curl -s -o /dev/null http://127.0.0.1:10000; do sleep 1; done'
      - run: poetry run pytest -v tests/test_store_contract.py
        env:
          AZURITE_CONNECTION_STRING: UseDevelopmentStorage=true

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@12.2.2 && npm --version
      - run: npm ci
      - run: npm test

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install -g npm@12.2.2 && npm --version
      - run: npm ci
      - run: npm run lint
      # The build writes next-env.d.ts, which tsc needs, so it runs first.
      - run: npm run build
      - run: npx tsc --noEmit

  frontend-e2e:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: backend/.python-version
          cache: poetry
          cache-dependency-path: backend/poetry.lock
      - run: poetry install --no-interaction
        working-directory: backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/azurite/package-lock.json
      - run: npm install -g npm@12.2.2 && npm --version
      - run: npm ci
        working-directory: frontend
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: azurite
        with:
          path: frontend/e2e/azurite/node_modules
          key: azurite-${{ runner.os }}-${{ hashFiles('frontend/e2e/azurite/package-lock.json') }}
      - run: npm ci --prefix e2e/azurite
        if: steps.azurite.outputs.cache-hit != 'true'
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
