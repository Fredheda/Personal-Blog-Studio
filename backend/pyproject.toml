[project]
name = "personal-blog-studio-backend"
version = "0.1.0"
description = "Blog studio API and blog read API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.50.0",
    "pydantic==2.14.3",
    "azure-storage-blob==12.31.1",
    "azure-identity==1.27.0",
    "python-ulid==4.1.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
httpx2 = ">=2.0.0,<3.0.0"
ruff = "0.17.3"
pyright = "1.1.414"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
# ruff's default rules (E4, E7, E9, F) plus import sorting (I)
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
include = ["blog_core", "studio_api", "blog_api", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
